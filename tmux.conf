# Plugins require https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

unbind C-b 
set-environment -g 'IGNOREEOF' 20
set-window-option -g automatic-rename off
set-window-option -g status-right 'pane-sync-mode:#{pane_synchronized}'
set-window-option -g mode-keys vi
setw -g pane-base-index 1
set-option -g allow-rename off
set-option -g prefix C-q
set-option -g pane-border-status top
set-option -g pane-border-format " ${pane_title} "
set -g base-index 1
set -g mouse on
set -g default-terminal "screen-256color"
bind G setw synchronize-pane on
bind g setw synchronize-pane off 
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T prefix Escape copy-mode

# Copy to the system clipboard (requires tmux >= 3.2). copy-pipe with no
# argument, including the default mouse-drag binding, pipes to copy-command.
# set-clipboard also sends OSC 52, so copying works over SSH in terminals that support it.
set -s set-clipboard on
if-shell 'command -v pbcopy >/dev/null' 'set -s copy-command "pbcopy"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null' 'set -s copy-command "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip >/dev/null' 'set -s copy-command "xclip -in -selection clipboard"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && ! command -v xclip >/dev/null && command -v xsel >/dev/null' 'set -s copy-command "xsel --clipboard --input"'

run '~/.tmux/plugins/tpm/tpm'

